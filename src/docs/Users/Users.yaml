paths:
  /api/users:
    get:
      summary: Obtenemos todos los usuarios de la BD
      tags:
        - Users
      responses:
        "200":
          description: La consulta fue exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        "500":
          description: Error en el servidor

    post:
      summary: Creamos un nuevo usuario
      tags:
        - Users
      requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/requestBodies/createUser'
      responses:
        "201":
          description: Usuario creado exitosamente
        "500":
          description: Error en el servidor
  
  /api/users/{uid}:
    get:
      summary: Obtiene un solo usuario por ID
      tags: 
        - Users
      parameters: 
      - name: uid
        in: path
        required: true
        description: id del usuario que se quiere buscar
        schema: 
          type: string
      responses: 
        "200":
          description: Usuario encontrado
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: "#components/schemas/User"
        "500":
          description: Error interno del servidor. 

    put:
      summary: Actualizamos usuario por ID
      tags: 
        - Users
      parameters: 
      - name: uid
        in: path
        required: true
        description: id del usuario que se quiere actualizar
        schema:
          type: string
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#components/requestBodies/updateUser"
      responses: 
        "200":
          description: Usuario actualizado correctamente
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno fatal critico terrible del servidor   
           
    delete:
      summary: Elimina un usuario por ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: id del usuario que se quiere eliminar
          schema:
            type: string
      responses:
        "200":
          description: Usuario eliminado correctamente
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor

components:
  schemas:
    User:
      type: object
      properties:
        -id:
          type: ObjectId
          description: Id autogenerado por MongoDB
        -first_name:
          type: string
          description: Nombre del usuario
        -last_name:
          type: string
          description: Apellido del usuario
        -email:
          type: string
          description: Correo electronico del usuario
        -password:
          type: string
          description: Contraseña del usuario
      example:
        _id: ObjectId("12345")
        first_name: "Pepe"
        last_name: "Argento"
        email: "pepe@argento.com"
        password: 1234

  requestBodies:
    createUser:
      type: object
      properties:
        first_name:
          type: string
          description: Nombre del usuario
        last_name:
          type: string
          description: Apellido del usuario
        email:
          type: string
          description: Correo electronico del usuario
        password:
          type: string
          description: Contraseña del usuario
      example:
        first_name: "Tony"
        last_name: "Stark"
        email: "tony@stark.com"
        password: "1234"
    updateUser:
      type: object
      properties:
        first_name:
          type: string
          description: Nombre del usuario
        last_name:
          type: string
          description: Apellido del usuario
        email:
          type: string
          description: Correo electronico del usuario
        password:
          type: string
          description: Contraseña del usuario
      example:
        first_name: "Duende"
        last_name: "Verde"
        email: "duende@verde.com"
        password: "1234"
